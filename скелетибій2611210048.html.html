       <!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скелети — 3D Файтинг (2D лінії)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#07070d;
    font-family:'Trebuchet MS',system-ui,sans-serif;user-select:none}
  canvas{display:block}

  #hud{position:fixed;inset:0;pointer-events:none;padding:16px 22px;
    display:flex;flex-direction:column}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .side{width:38%}
  .side.right{text-align:right}
  .name{font-size:12px;letter-spacing:3px;font-weight:bold;margin-bottom:6px;
    color:#8fb2ff;text-shadow:0 0 14px #2f6bff,0 0 4px #2f6bff}
  .side.right .name{color:#ffb083;text-shadow:0 0 14px #ff5a1f,0 0 4px #ff5a1f}
  .bar{height:15px;display:flex;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);border-radius:9px;overflow:hidden;
    box-shadow:inset 0 0 14px rgba(0,0,0,.9)}
  .side.right .bar{justify-content:flex-end}
  .fill{height:100%;width:100%;border-radius:8px;transition:width .1s linear}
  #hp0{background:linear-gradient(90deg,#1235c9,#5aa2ff);box-shadow:0 0 16px #3f7bff}
  #hp1{background:linear-gradient(270deg,#c93a10,#ffb03a);box-shadow:0 0 16px #ff7a2f}
  .score{font-size:40px;font-weight:bold;line-height:1;margin-top:4px;color:#dbe6ff;
    text-shadow:0 0 20px #3f7bff,0 0 46px #1a3fb0}
  .side.right .score{text-shadow:0 0 20px #ff7a2f,0 0 46px #b03a10}
  .center{text-align:center;flex:1}
  .vs{font-size:26px;font-weight:bold;letter-spacing:4px;color:#fff;
    text-shadow:0 0 18px #fff,0 0 40px #6f8cff;animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
  .round{margin-top:5px;font-size:11px;letter-spacing:4px;color:#7e8aa8}

  #banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;font-size:min(58px,9vw);font-weight:bold;letter-spacing:8px;color:#fff;
    text-shadow:0 0 30px #6f8cff,0 0 80px #2f6bff;opacity:0;transition:opacity .22s}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="row">
    <div class="side left">
      <div class="name">СКЕЛЕТ · КРИГА</div>
      <div class="bar"><div class="fill" id="hp0"></div></div>
      <div class="score" id="sc0">0</div>
    </div>
    <div class="center">
      <div class="vs">VS</div>
      <div class="round" id="round">РАУНД 1</div>
    </div>
    <div class="side right">
      <div class="name">СКЕЛЕТ · ПОЛУМ'Я</div>
      <div class="bar"><div class="fill" id="hp1"></div></div>
      <div class="score" id="sc1">0</div>
    </div>
  </div>
</div>
<div id="banner"></div>

<script>
"use strict";

/* =====================================================
   0. ПОЛОТНО
   ===================================================== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 1, H = 1, CX = 0, CY = 0, FOCAL = 500, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2;
  CY = H / 2;
  FOCAL = Math.min(H * 0.95, W * 0.82);
}
window.addEventListener('resize', resize);
resize();

/* =====================================================
   1. МІНІ-МАТЕМАТИКА 3D
   ===================================================== */
const V = {
  sub:  (a,b)=>[a[0]-b[0], a[1]-b[1], a[2]-b[2]],
  add:  (a,b)=>[a[0]+b[0], a[1]+b[1], a[2]+b[2]],
  dot:  (a,b)=>a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  norm: a=>{const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l];}
};

const IDENT = [1,0,0, 0,1,0, 0,0,1];

function mMul(a, b) {
  const r = new Array(9);
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      r[i*3+j] = a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j];
    }
  }
  return r;
}
function mApply(m, v) {
  return [
    m[0]*v[0] + m[1]*v[1] + m[2]*v[2],
    m[3]*v[0] + m[4]*v[1] + m[5]*v[2],
    m[6]*v[0] + m[7]*v[1] + m[8]*v[2]
  ];
}
function mRot(rx, ry, rz) {
  const cx = Math.cos(rx), sx = Math.sin(rx);
  const cy = Math.cos(ry), sy = Math.sin(ry);
  const cz = Math.cos(rz), sz = Math.sin(rz);
  const Rx = [1,0,0,  0,cx,-sx,  0,sx,cx];
  const Ry = [cy,0,sy,  0,1,0,  -sy,0,cy];
  const Rz = [cz,-sz,0,  sz,cz,0,  0,0,1];
  return mMul(mMul(Ry, Rx), Rz);
}

/* =====================================================
   2. КАМЕРА + ПРОЕКЦІЯ
   ===================================================== */
const cam = { pos:[0, 2.25, 6.1], target:[0, 1.15, 0], up:[0,1,0] };
let basis = { f:[0,0,-1], r:[1,0,0], u:[0,1,0] };

function updateBasis() {
  const f = V.norm(V.sub(cam.target, cam.pos));
  const r = V.norm(V.cross(f, cam.up));
  const u = V.cross(r, f);
  basis.f = f; basis.r = r; basis.u = u;
}

function project(p) {
  const dx = p[0]-cam.pos[0], dy = p[1]-cam.pos[1], dz = p[2]-cam.pos[2];
  const z = dx*basis.f[0] + dy*basis.f[1] + dz*basis.f[2];
  if (z < 0.12) return null;
  const s = FOCAL / z;
  return {
    x: CX + (dx*basis.r[0] + dy*basis.r[1] + dz*basis.r[2]) * s,
    y: CY - (dx*basis.u[0] + dy*basis.u[1] + dz*basis.u[2]) * s,
    s, z
  };
}

/* =====================================================
   3. СКЕЛЕТ (ієрархія вузлів)
   ===================================================== */
function mkNode(name, off, parent) {
  const n = {
    name, off, rx:0, ry:0, rz:0,
    children: [], pos:[0,0,0], mat: IDENT.slice()
  };
  if (parent) parent.children.push(n);
  return n;
}

function makeSkeleton() {
  const root   = mkNode('root',   [0,0,0], null);
  const pelvis = mkNode('pelvis', [0,0,0],       root);
  const spine1 = mkNode('spine1', [0, 0.10, 0],  pelvis);
  const spine2 = mkNode('spine2', [0, 0.16, 0],  spine1);
  const chest  = mkNode('chest',  [0, 0.16, 0],  spine2);
  const neck   = mkNode('neck',   [0, 0.12, 0],  chest);
  const head   = mkNode('head',   [0, 0.14, 0],  neck);

  const shL = mkNode('shL', [-0.19, 0.02, 0], chest);
  const elL = mkNode('elL', [0, -0.30, 0], shL);
  const haL = mkNode('haL', [0, -0.28, 0], elL);

  const shR = mkNode('shR', [ 0.19, 0.02, 0], chest);
  const elR = mkNode('elR', [0, -0.30, 0], shR);
  const haR = mkNode('haR', [0, -0.28, 0], elR);

  const hipL = mkNode('hipL', [-0.11, -0.02, 0], pelvis);
  const knL  = mkNode('knL',  [0, -0.42, 0], hipL);
  const ftL  = mkNode('ftL',  [0, -0.42, 0], knL);
  const toL  = mkNode('toL',  [0, -0.02, 0.13], ftL);

  const hipR = mkNode('hipR', [ 0.11, -0.02, 0], pelvis);
  const knR  = mkNode('knR',  [0, -0.42, 0], hipR);
  const ftR  = mkNode('ftR',  [0, -0.42, 0], knR);
  const toR  = mkNode('toR',  [0, -0.02, 0.13], ftR);

  return { root, pelvis, spine1, spine2, chest, neck, head,
           shL, elL, haL, shR, elR, haR,
           hipL, knL, ftL, toL, hipR, knR, ftR, toR };
}

function updateNode(n, parentPos, parentMat) {
  const local = mRot(n.rx, n.ry, n.rz);
  const off = mApply(parentMat, n.off);
  n.pos[0] = parentPos[0] + off[0];
  n.pos[1] = parentPos[1] + off[1];
  n.pos[2] = parentPos[2] + off[2];
  n.mat = mMul(parentMat, local);
  for (let i = 0; i < n.children.length; i++) {
    updateNode(n.children[i], n.pos, n.mat);
  }
}

const HIP_Y = 0.95;

function updateSkeleton(f) {
  const j = f.joints;
  const fall = (f.state === 'dead') ? f.deathK : 0;
  const fe = fall * fall;

  const rootMat = mMul(mRot(0, f.yaw, 0), mRot(-1.5 * fe, 0, 0));
  const baseY = HIP_Y - 0.70 * fe + f.yOff;
  const rootPos = [f.x, baseY, 0];

  j.root.pos = rootPos;
  j.root.mat = rootMat;
  for (let i = 0; i < j.root.children.length; i++) {
    updateNode(j.root.children[i], rootPos, rootMat);
  }
}

/* =====================================================
   4. БОЄЦЬ
   ===================================================== */
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const easeOut = t => 1 - (1-t)*(1-t)*(1-t);
const easeIn  = t => t*t*t;

class Fighter {
  constructor(color, x, faceDir) {
    this.color = color;
    this.x = x;
    this.faceDir = faceDir;
    this.yaw = faceDir > 0 ? Math.PI/2 : -Math.PI/2;

    this.hp = 100;
    this.maxHp = 100;

    this.state = 'idle';
    this.t = 0;
    this.animT = Math.random() * 10;
    this.idleWait = 0.2 + Math.random() * 0.4;
    this.hitDone = false;
    this.armSide = 1;
    this.legSide = 1;

    this.deathK = 0;
    this.yOff = 0;

    this.joints = makeSkeleton();
  }

  setState(s) { this.state = s; this.t = 0; }

  resetPose() {
    const j = this.joints;
    j.pelvis.rx = j.pelvis.ry = j.pelvis.rz = 0;
    j.spine1.rx = j.spine1.ry = j.spine1.rz = 0;
    j.spine2.rx = j.spine2.ry = j.spine2.rz = 0;
    j.chest.rx  = j.chest.ry  = j.chest.rz  = 0;
    j.neck.rx   = j.neck.ry   = j.neck.rz   = 0;
    j.head.rx   = j.head.ry   = j.head.rz   = 0;

    j.shL.rx = 0; j.shL.rz = -0.14;
    j.elL.rx = -0.20;
    j.shR.rx = 0; j.shR.rz =  0.14;
    j.elR.rx = -0.20;

    j.hipL.rx = 0; j.hipL.rz = -0.04; j.knL.rx = 0.10;
    j.hipR.rx = 0; j.hipR.rz =  0.04; j.knR.rx = 0.10;
    j.ftL.rx = 0; j.ftR.rx = 0;

    this.yOff = 0;
  }

  /* ---------- пози ---------- */
  poseIdle() {
    const j = this.joints, t = this.animT;
    const b = Math.sin(t * 2.7);
    j.spine1.rx = -0.02 + b * 0.02;
    j.chest.rx  = b * 0.02;
    j.head.ry   = Math.sin(t * 0.9) * 0.16;
    j.shL.rx =  b * 0.07;
    j.shR.rx = -b * 0.07;
    j.knL.rx = 0.13 + b * 0.03;
    j.knR.rx = 0.13 - b * 0.03;
    j.hipL.rx = -0.05;
    j.hipR.rx = -0.05;
    this.yOff = -Math.abs(b) * 0.012;
  }

  poseWalk(ph) {
    const j = this.joints;
    const s = Math.sin(ph), c = Math.cos(ph);
    j.hipL.rx = -s * 0.58;
    j.hipR.rx =  s * 0.58;
    j.knL.rx  = Math.max(0, -s) * 0.85 + 0.10;
    j.knR.rx  = Math.max(0,  s) * 0.85 + 0.10;
    j.shL.rx  =  s * 0.45;
    j.shR.rx  = -s * 0.45;
    j.spine1.rx = 0.04;
    j.spine1.rz = s * 0.03;
    this.yOff = Math.abs(c) * 0.028;
  }

  poseAttack(type, prog) {
    const j = this.joints;
    const k = prog < 0.32
      ? easeOut(prog / 0.32)
      : 1 - easeIn(clamp((prog - 0.32) / 0.68, 0, 1));

    if (type === 'punch') {
      const side = this.armSide;
      const sh  = side === 1 ? j.shR : j.shL;
      const el  = side === 1 ? j.elR : j.elL;
      const osh = side === 1 ? j.shL : j.shR;

      sh.rx = -1.58 * k;
      sh.rz = side * (0.14 - k * 0.10);
      el.rx = -0.20 + 0.22 * k;

      osh.rx = 0.55 * k;

      j.spine1.ry = -side * 0.36 * k;
      j.spine1.rx = 0.09 * k;
      j.head.ry   = -side * 0.16 * k;

      j.knL.rx = 0.15 + k * 0.10;
      j.knR.rx = 0.15 + k * 0.10;
      this.yOff = -0.02 * k;
    } else {
      const side = this.legSide;
      const hip  = side === 1 ? j.hipR : j.hipL;
      const kn   = side === 1 ? j.knR  : j.knL;
      const ship = side === 1 ? j.hipL : j.hipR;
      const skn  = side === 1 ? j.knL  : j.knR;

      hip.rx = -1.42 * k;
      kn.rx  = (1 - k) * 0.95 + k * 0.04;

      ship.rx = 0.14 * k;
      skn.rx  = 0.38 * k;

      j.spine1.rx = -0.26 * k;
      j.head.rx   =  0.18 * k;
      j.shL.rx = -0.55 * k;
      j.shR.rx = -0.55 * k;

      this.yOff = -0.035 * k;
    }
  }

  poseHurt() {
    const j = this.joints;
    const up = Math.min(1, this.t / 0.055);
    const dn = Math.max(0, 1 - Math.max(0, (this.t - 0.11) / 0.13));
    const k = up * dn;
    j.spine1.rx = -0.38 * k;
    j.chest.rx  = -0.20 * k;
    j.head.rx   = -0.32 * k;
    j.shL.rx = 0.60 * k;
    j.shR.rx = 0.60 * k;
    j.elL.rx = -0.20 - 0.45 * k;
    j.elR.rx = -0.20 - 0.45 * k;
    j.knL.rx = 0.12 + 0.22 * k;
    j.knR.rx = 0.12 + 0.22 * k;
    this.yOff = -0.05 * k;
  }

  /* ---------- логіка ---------- */
  startAttack() {
    const kick = Math.random() < 0.38;
    this.armSide = Math.random() < 0.5 ? 1 : -1;
    this.legSide = Math.random() < 0.5 ? 1 : -1;
    this.hitDone = false;
    this.setState(kick ? 'kick' : 'punch');
  }

  takeHit(dmg, opp) {
    if (this.state === 'dead') return;

    this.hp -= dmg;
    shake = Math.max(shake, 0.13);

    // іскри в точці удару
    const px = (this.x + opp.x) * 0.5;
    const pp = project([px, 1.15 + Math.random() * 0.35, 0]);
    if (pp) spawnSparks(pp.x, pp.y, this.color);

    if (this.hp <= 0) {
      this.hp = 0;
      this.deathK = 0;
      this.setState('dead');
    } else {
      this.setState('hurt');
      this.x -= this.faceDir * 0.14;
    }
  }

  update(dt, opp) {
    this.animT += dt;
    this.t += dt;

    /* --- поворот корпусу (плавно) --- */
    const targetYaw = this.faceDir > 0 ? Math.PI / 2 : -Math.PI / 2;
    this.yaw += (targetYaw - this.yaw) * Math.min(1, dt * 16);

    /* --- смерть --- */
    if (this.state === 'dead') {
      this.deathK = Math.min(1, this.deathK + dt * 1.7);
      return;
    }

    this.resetPose();

    const dx = opp.x - this.x;
    const dist = Math.abs(dx);
    const toward = dx >= 0 ? 1 : -1;
    if (toward !== this.faceDir) this.faceDir = toward;

    switch (this.state) {

      case 'idle': {
        this.poseIdle();
        if (this.t > this.idleWait) {
          if (dist > 1.42) this.setState('approach');
          else this.startAttack();
        }
        break;
      }

      case 'approach': {
        this.x += this.faceDir * 3.4 * dt;
        this.poseWalk(this.animT * 12);
        if (dist <= 1.26) {
          this.setState('idle');
          this.idleWait = 0.02;
        }
        break;
      }

      case 'punch':
      case 'kick': {
        const isPunch = this.state === 'punch';
        const dur     = isPunch ? 0.30 : 0.42;
        const hitTime = isPunch ? 0.09 : 0.17;
        const range   = isPunch ? 1.55 : 1.85;
        const prog    = this.t / dur;

        if (!this.hitDone && this.t >= hitTime) {
          this.hitDone = true;
          if (dist < range) {
            const dmg = isPunch
              ? 6 + Math.random() * 5
              : 10 + Math.random() * 7;
            opp.takeHit(dmg, this);
          }
        }

        this.poseAttack(this.state, Math.min(prog, 1));

        if (prog >= 1) {
          this.setState('idle');
          this.idleWait = 0.05 + Math.random() * 0.25;
        }
        break;
      }

      case 'hurt': {
        this.poseHurt();
        if (this.t > 0.22) {
          this.setState('idle');
          this.idleWait = 0.03 + Math.random() * 0.16;
        }
        break;
      }
    }

    this.x = clamp(this.x, -5.0, 5.0);
  }
}

/* =====================================================
   5. БІЙЦІ + HUD
   ===================================================== */
const P1_COLOR = '#5aa2ff';
const P2_COLOR = '#ffab4d';

const f1 = new Fighter(P1_COLOR, -2.0,  1);
const f2 = new Fighter(P2_COLOR,  2.0, -1);
const fighters = [f1, f2];

const hpEls   = [document.getElementById('hp0'), document.getElementById('hp1')];
const scEls   = [document.getElementById('sc0'), document.getElementById('sc1')];
const roundEl = document.getElementById('round');
const bannerEl= document.getElementById('banner');

const scores = [0, 0];
let roundNum = 1;

function updateHUD() {
  hpEls[0].style.width = (f1.hp / f1.maxHp * 100) + '%';
  hpEls[1].style.width = (f2.hp / f2.maxHp * 100) + '%';
  scEls[0].textContent = scores[0];
  scEls[1].textContent = scores[1];
  roundEl.textContent = 'РАУНД ' + roundNum;
}

let bannerTimer = null;
function banner(text, time) {
  bannerEl.textContent = text;
  bannerEl.style.opacity = 1;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => bannerEl.style.opacity = 0, time || 800);
}

/* =====================================================
   6. ЧАСТИНКИ (екранні)
   ===================================================== */
const sparks = [];

function spawnSparks(x, y, color) {
  for (let i = 0; i < 11; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 70 + Math.random() * 300;
    sparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 70,
      life: 0,
      max: 0.30 + Math.random() * 0.32,
      color,
      size: 1.4 + Math.random() * 2.6
    });
  }
}

function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.life += dt;
    if (p.life >= p.max) { sparks.splice(i, 1); continue; }
    p.vy += 950 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (1 - 2.2 * dt);
  }
}

function drawSparks() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of sparks) {
    const k = 1 - p.life / p.max;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * k, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* =====================================================
   7. МАЛЮВАННЯ СЦЕНИ
   ===================================================== */
let shake = 0;

function drawFloor() {
  const R = 6;

  // концентричні кільця
  for (let ring = 1; ring <= 3; ring++) {
    const r = R * ring / 3;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i <= 72; i++) {
      const a = i / 72 * Math.PI * 2;
      const p = project([Math.cos(a) * r, 0, Math.sin(a) * r]);
      if (!p) { started = false; continue; }
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.lineWidth = ring === 3 ? 1.8 : 1;
    ctx.strokeStyle = ring === 3 ? 'rgba(90,140,255,0.55)' : 'rgba(60,90,170,0.22)';
    ctx.stroke();
  }

  // радіальні лінії
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(60,90,170,0.16)';
  const c0 = project([0, 0, 0]);
  if (c0) {
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      const p2 = project([Math.cos(a) * R, 0, Math.sin(a) * R]);
      if (!p2) continue;
      ctx.beginPath();
      ctx.moveTo(c0.x, c0.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }
  }
}

function drawShadow(f) {
  const p = project([f.x, 0.01, 0]);
  if (!p) return;
  const rx = 0.52 * p.s;
  const ry = rx * 0.30;
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rx);
  g.addColorStop(0, 'rgba(0,0,0,0.55)');
  g.addColorStop(0.6, 'rgba(0,0,0,0.22)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function addFighterItems(f, items) {
  const j = f.joints;
  const col = f.color;

  const line = (a, b, w) => items.push({
    type: 'line', a: a.pos, b: b.pos, color: col, w: w || 1
  });

  // хребет
  line(j.pelvis, j.spine1);
  line(j.spine1, j.spine2);
  line(j.spine2, j.chest);
  line(j.chest,  j.neck);
  line(j.neck,   j.head);

  // таз і ключиці
  line(j.hipL, j.hipR, 1.15);
  line(j.shL,  j.shR,  1.15);

  // руки
  line(j.chest, j.shL); line(j.shL, j.elL); line(j.elL, j.haL);
  line(j.chest, j.shR); line(j.shR, j.elR); line(j.elR, j.haR);

  // ноги
  line(j.pelvis, j.hipL); line(j.hipL, j.knL);
  line(j.knL, j.ftL);     line(j.ftL, j.toL);
  line(j.pelvis, j.hipR); line(j.hipR, j.knR);
  line(j.knR, j.ftR);     line(j.ftR, j.toR);

  // ребра (короткі промені від хребта вбік)
  const m = j.chest.mat;
  const rx = m[0], ry = m[3], rz = m[6];   // локальна вісь X у світі
  const bases = [j.spine2.pos, j.chest.pos];
  for (let b = 0; b < bases.length; b++) {
    const base = bases[b];
    for (let s = -1; s <= 1; s += 2) {
      items.push({
        type: 'line',
        a: base,
        b: [base[0] + rx * 0.15 * s, base[1] + 0.015, base[2] + rz * 0.15 * s],
        color: col, w: 0.8
      });
    }
  }

  // череп
  items.push({ type: 'circle', p: j.head.pos, r: 0.135, color: col });
}

function drawItems(items) {
  const out = [];

  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.type === 'line') {
      const A = project(it.a);
      const B = project(it.b);
      if (!A || !B) continue;
      out.push({ z: (A.z + B.z) * 0.5, A, B, color: it.color, w: it.w });
    } else {
      const C = project(it.p);
      if (!C) continue;
      out.push({ z: C.z, C, r: it.r * C.s, color: it.color, circle: true });
    }
  }

  out.sort((p, q) => q.z - p.z);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let i = 0; i < out.length; i++) {
    const o = out[i];

    if (o.circle) {
      ctx.beginPath();
      ctx.arc(o.C.x, o.C.y, o.r, 0, Math.PI * 2);
      ctx.fillStyle = '#0b0b12';
      ctx.fill();

      ctx.globalAlpha = 0.22;
      ctx.lineWidth = 7;
      ctx.strokeStyle = o.color;
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = '#eee6d2';
      ctx.stroke();
      continue;
    }

    const lw = Math.max(0.9, Math.min(4.5, o.w * o.A.s * 0.022));

    // ореол
    ctx.globalAlpha = 0.16;
    ctx.lineWidth = lw * 4.2;
    ctx.strokeStyle = o.color;
    ctx.beginPath();
    ctx.moveTo(o.A.x, o.A.y);
    ctx.lineTo(o.B.x, o.B.y);
    ctx.stroke();

    // сама кістка
    ctx.globalAlpha = 1;
    ctx.lineWidth = lw * 1.7;
    ctx.strokeStyle = '#e9e2cf';
    ctx.beginPath();
    ctx.moveTo(o.A.x, o.A.y);
    ctx.lineTo(o.B.x, o.B.y);
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
}

/* =====================================================
   8. ІГРОВИЙ ЦИКЛ
   ===================================================== */
let phase = 'fight';     // fight | over
let phaseTimer = 0;

function resetRound() {
  f1.x = -2.0;  f2.x = 2.0;
  f1.hp = f1.maxHp; f2.hp = f2.maxHp;
  f1.deathK = 0; f2.deathK = 0;
  f1.yOff = 0;  f2.yOff = 0;
  f1.faceDir =  1; f1.yaw =  Math.PI / 2;
  f2.faceDir = -1; f2.yaw = -Math.PI / 2;
  f1.setState('idle'); f1.idleWait = 0.2;
  f2.setState('idle'); f2.idleWait = 0.2;
  roundNum++;
  updateHUD();
  banner('РАУНД ' + roundNum, 700);
}

function step(dt) {
  if (phase === 'fight') {
    f1.update(dt, f2);
    f2.update(dt, f1);

    // не злипаємось
    const d = f2.x - f1.x;
    if (Math.abs(d) < 0.92) {
      const push = (0.92 - Math.abs(d)) * 0.5 * (d >= 0 ? 1 : -1);
      f1.x -= push;
      f2.x += push;
    }

    // перевірка кінця раунду
    if (f1.hp <= 0 || f2.hp <= 0) {
      phase = 'over';
      phaseTimer = 0;
      if (f1.hp <= 0 && f2.hp <= 0) {
        banner('НІЧИЯ', 1200);
      } else if (f1.hp <= 0) {
        scores[1]++; updateHUD();
        banner("ПОЛУМ'Я ПЕРЕМАГАЄ", 1200);
      } else {
        scores[0]++; updateHUD();
        banner('КРИГА ПЕРЕМАГАЄ', 1200);
      }
    }
  } else {
    phaseTimer += dt;
    f1.update(dt, f2);
    f2.update(dt, f1);
    if (phaseTimer > 1.35) {
      phase = 'fight';
      resetRound();
    }
  }

  updateSparks(dt);

  // камера
  const midX = (f1.x + f2.x) * 0.5;
  const targetX = midX * 0.32;
  cam.pos[0] += (targetX - cam.pos[0]) * Math.min(1, dt * 3.2);
  cam.target[0] = cam.pos[0];

  if (shake > 0) {
    shake = Math.max(0, shake - dt * 1.8);
    cam.pos[0] += (Math.random() - 0.5) * shake;
    cam.pos[1] = 2.25 + (Math.random() - 0.5) * shake * 1.4;
  } else {
    cam.pos[1] += (2.25 - cam.pos[1]) * Math.min(1, dt * 5);
  }
  cam.pos[2] = 6.1 + Math.sin(performance.now() * 0.0004) * 0.25;
}

function render() {
  // фон
  ctx.fillStyle = '#07070d';
  ctx.fillRect(0, 0, W, H);

  updateBasis();

  drawFloor();
  drawShadow(f1);
  drawShadow(f2);

  const items = [];
  updateSkeleton(f1); addFighterItems(f1, items);
  updateSkeleton(f2); addFighterItems(f2, items);
  drawItems(items);

  drawSparks();

  // легка віньєтка
  const g = ctx.createRadialGradient(CX, CY, Math.min(W, H) * 0.25,
                                     CX, CY, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;   // стабільність при лагах
  step(dt);
  render();
}

/* =====================================================
   9. СТАРТ
   ===================================================== */
updateHUD();
banner('БІЙ!', 800);
requestAnimationFrame(loop);
</script>
